name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Add TMDB_API_KEY under repo Settings → Secrets → Actions.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_BASE: https://api.themoviedb.org/3
